<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Graphics Learning Environment</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- UI Module Container -->
        <div id="ui-container">
            <header>
                <h1>3D Graphics Learning Environment</h1>
                <nav id="main-nav">
                    <button data-module="perspective">Perspective</button>
                    <button data-module="points">Points</button>
                    <button data-module="wireframe">Wireframe</button>
                    <button data-module="surface">Surface</button>
                    <button data-module="raytracing">Ray Tracing</button>
                    <button data-module="math-surface">Math Surface</button>
                    <button data-module="voxel">Voxel</button>
                    <button data-module="generators">Generators</button>
                    <button data-module="terrain">Terrain</button>
                </nav>
            </header>
            
            <main id="canvas-container">
                <canvas id="main-canvas"></canvas>
                <div id="test-overlay"></div>
            </main>
            
            <aside id="controls-panel">
                <div id="module-controls"></div>
                <button id="run-self-test-btn" style="margin-top: 20px; padding: 10px; background: #ff9800; color: white; border: none; cursor: pointer;">🧪 Run Self-Test</button>
            </aside>
        </div>
    </div>

    <!-- Main Application Entry Point -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
